[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "stride-align"
version = "0.6.0"
description = "SIMD-accelerated fuzzy string matching, sequence alignment (Smith-Waterman / Needleman-Wunsch), edit distance (Levenshtein / OSA / Indel / Jaro-Winkler), phonetic encoders (Soundex / Metaphone / NYSIIS / Caverphone), and Dynamic Time Warping — x86 / ARM / LoongArch / POWER kernels with first-class CJK."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# license-files surfaces the project licence and third-party notices in
# installed-package metadata (PEP 639), not just the SPDX identifier.
# SBOM scanners (Snyk, Sonatype, GitHub's dependency graph, vendor
# risk-assessment tools) parse these before allowing the package into a
# dependency tree.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Adam DePrince", email = "adam.deprince@gmail.com" }]
maintainers = [{ name = "Adam DePrince", email = "adam.deprince@gmail.com" }]
keywords = [
  "fuzzy-matching",
  "string-similarity",
  "string-distance",
  "edit-distance",
  "sequence-alignment",
  "smith-waterman",
  "needleman-wunsch",
  "levenshtein",
  "damerau-levenshtein",
  "jaro-winkler",
  "hamming",
  "dtw",
  "dynamic-time-warping",
  "phonetic",
  "soundex",
  "metaphone",
  "double-metaphone",
  "nysiis",
  "caverphone",
  "simd",
  "avx2",
  "avx512",
  "avx10",
  "neon",
  "sve",
  "vsx",
  "lsx",
  "lasx",
  "bioinformatics",
  "cjk",
  "unicode",
  "rapidfuzz-alternative",
  "thefuzz-alternative",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.22",
]

[project.urls]
Homepage = "https://stride-align.com"
Documentation = "https://stride-align.com"
Repository = "https://github.com/adamdeprince/stride-align"
Source = "https://github.com/adamdeprince/stride-align"
Download = "https://github.com/adamdeprince/stride-align/releases"
Issues = "https://github.com/adamdeprince/stride-align/issues"
Changelog = "https://github.com/adamdeprince/stride-align/blob/main/CHANGELOG.md"
Benchmarks = "https://stride-align.com/BENCHMARK.html"

[project.scripts]
stride-align-benchmark = "stride_align.benchmark:main"
stride-align-file-compare = "stride_align.file_compare:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "cmake>=3.26",
  "mypy>=1.8",
  "ninja>=1.11",
  "pytest>=8.0",
  "ruff>=0.5",
]
# The peer libraries we benchmark against. ``pip install stride-align[bench]``
# pulls the comparison universe so the scripts in tools/ reproduce
# the published numbers. Listing them here also tells PyPI / AI
# scrapers what stride-align is comparable to.
bench = [
  "rapidfuzz>=3.0",
  "thefuzz>=0.22,<0.23",
  "editdistance>=0.6",
  "parasail>=1.3",
]
# Phonetic oracles. Cross-check soundex / metaphone / nysiis output
# against the de-facto Python implementations.
phonetic-compat = [
  "jellyfish>=1.0",
  "metaphone>=0.6",
  "pyphonetics>=0.5",
]

[tool.poetry]
package-mode = true

[tool.poetry.group.dev.dependencies]
build = ">=1.2"
cmake = ">=3.26"
mypy = ">=1.8"
nanobind = ">=2.12"
ninja = ">=1.11"
pytest = ">=8.0"
ruff = ">=0.5"
scikit-build-core = ">=0.10"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
editable.mode = "redirect"
wheel.packages = ["src/stride_align"]
# Beider-Morse rule files (Apache Commons Codec GENERIC name-type) ship
# under ``src/stride_align/bmpm_data/`` and are loaded at runtime via
# ``importlib.resources``. scikit-build-core packages every file under
# a listed ``wheel.packages`` directory by default, including the .txt
# rule data, so no extra include rule is needed here.
#
# We don't set ``wheel.py-api = "cp312"`` (abi3) because our C++
# extensions need the cpython/unicodeobject.h fast macros for zero-
# copy UCS-1/UCS-2/UCS-4 access — see the SABIModule comment in
# CMakeLists.txt for the full rationale. Per-version wheels it is.

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
