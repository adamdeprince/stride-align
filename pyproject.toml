[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "stride-align"
version = "0.3.0"
description = "Smith-Waterman and Needleman-Wunsch alignments with a nanobind C++20 backend."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Adam" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.22",
]

[project.scripts]
stride-align-benchmark = "stride_align.benchmark:main"
stride-align-file-compare = "stride_align.file_compare:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "cmake>=3.26",
  "mypy>=1.8",
  "ninja>=1.11",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.poetry]
package-mode = true

[tool.poetry.group.dev.dependencies]
build = ">=1.2"
cmake = ">=3.26"
mypy = ">=1.8"
nanobind = ">=2.12"
ninja = ">=1.11"
pytest = ">=8.0"
ruff = ">=0.5"
scikit-build-core = ">=0.10"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
editable.mode = "redirect"
wheel.packages = ["src/stride_align"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
